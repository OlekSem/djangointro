<!DOCTYPE html>
<html>
<head>
    <title>Set New Password</title>
</head>
<body>

<h2>Set a new password</h2>

{% if validlink %}

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Change password</button>
</form>

{% else %}

<p>
This password reset link is invalid or has expired.
</p>

{% endif %}

</body>
</html>
